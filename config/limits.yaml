# Usage limits. Rate limits are per sliding window and enforced in Redis.
freeTier:
  dailyExercises: 20
sessions:
  # Account-sharing limits (C-24).
  maxConcurrentPerStudent: 2
  maxDevicesPerFamily: 4
rateLimits:
  # Requests per minute per signed-in user, for ordinary API routes.
  apiPerUserPerMinute: 120
  # Login failures (C-04).
  loginFailuresPerAccount: { limit: 5, windowMinutes: 15 }
  loginFailuresPerIpPrefix: { limit: 30, windowMinutes: 15 }
  # Wrong PINs per child profile; then the profile locks and the parent gets an SMS.
  childPinFailures: { limit: 5, windowMinutes: 30 }
  # Failed child sign-ins per family code (wrong nickname or PIN), against guessing across profiles.
  childLoginFailuresPerFamily: { limit: 15, windowMinutes: 30 }
  # After this many failures the account is locked for the rest of the window
  # and the owner gets an SMS (C-04).
  accountLock: { limit: 10, windowMinutes: 60 }
