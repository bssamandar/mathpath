# Monitoring stack (architecture §7.6; security plan C-34, C-38, C-39).
# Runs next to the app stack (infra/docker-compose.prod.yml, step 7.2) on the
# same host and joins its private network, so it can scrape the API and
# worker metrics ports. Everything stays in the country: no SaaS.
#
#   docker compose -f infra/monitoring/docker-compose.yml up -d
#
# Grafana listens on 127.0.0.1:3300 only; reach it through an SSH tunnel.
# Images are pinned by digest (C-44).
name: mathpath-monitoring

networks:
  # The app stack's private network. It has no internet access (`internal`).
  mathpath:
    external: true
    name: mathpath_private
  # Internet access for the services that need it: Alertmanager sends to
  # Telegram and email, the blackbox exporter checks the public URLs, and
  # Grafana publishes its port on 127.0.0.1 (impossible on an internal network).
  outbound: {}

volumes:
  prometheus: {}
  alertmanager: {}
  loki: {}
  grafana: {}

services:
  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus:/prometheus
    networks: [mathpath]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    command: [--config.file=/etc/alertmanager/alertmanager.yml, --storage.path=/alertmanager]
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./secrets:/etc/alertmanager/secrets:ro
      - alertmanager:/alertmanager
    networks: [mathpath, outbound]
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0@sha256:a50c4c0eda297baa1678cd4dc4712a67fdea713b832d43ce7fcc5f9bea05094d
    command: [--config.file=/etc/blackbox/blackbox.yml]
    volumes:
      - ./blackbox:/etc/blackbox:ro
    networks: [mathpath, outbound]
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.1@sha256:d00a542e409ee618a4edc67da14dd48c5da66726bbd5537ab2af9c1dfc442c8a
    command:
      - --path.rootfs=/host
      # The backup script writes mathpath_backup_last_success_timestamp_seconds here.
      - --collector.textfile.directory=/host/var/lib/node-exporter
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks: [mathpath]
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1@sha256:38606faa38c54787525fb0ff2fd6b41b4cfb75d455c1df294927c5f611699b17
    environment:
      # A read-only monitoring role (pg_monitor), not the app's role.
      DATA_SOURCE_URI: postgres:5432/mathpath?sslmode=disable
      DATA_SOURCE_USER: monitoring
      DATA_SOURCE_PASS_FILE: /run/secrets/postgres_monitoring_password
    volumes:
      - ./secrets/postgres_monitoring_password:/run/secrets/postgres_monitoring_password:ro
    networks: [mathpath]
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.74.0@sha256:88862b6fc5004ead3495c16d5ba548b14e898fe6d22e7c5b93bf3df83823a9a5
    environment:
      REDIS_ADDR: redis://redis:6379
    networks: [mathpath]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.3@sha256:3165cecce301ce5b9b6e3530284b080934a05cd5cafac3d3d82edcb887b45ecd
    command: [-config.file=/etc/loki/loki.yml]
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki:/loki
    networks: [mathpath]
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.10.0@sha256:1bc130e909116a4bf950eb5187a346007d3b796f96832b529acb14a64e41230f
    command: [run, /etc/alloy/config.alloy, --storage.path=/var/lib/alloy/data]
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [mathpath]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.2@sha256:b5b59bfc7561634c2d7b136c4543d702ebcc94a3da477f21ff26f89ffd4214fa
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: Asia/Tashkent
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./secrets/grafana_admin_password:/run/secrets/grafana_admin_password:ro
      - grafana:/var/lib/grafana
    ports:
      - 127.0.0.1:3300:3000
    # A published port needs a non-internal network.
    networks: [mathpath, outbound]
    restart: unless-stopped
