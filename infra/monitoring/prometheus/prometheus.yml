# Prometheus for MathPath. The API and worker expose /metrics on their own
# private ports (9464, 9465), never through the public reverse proxy.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: api
    # One target per API instance; add more as the API scales out.
    static_configs:
      - targets: ['api:9464']
  - job_name: worker
    static_configs:
      - targets: ['worker:9465']
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
  # External HTTPS checks: availability and certificate expiry, as users see it.
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [https_2xx]
    file_sd_configs:
      - files: ['/etc/prometheus/probes.yml']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
