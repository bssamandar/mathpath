# Release images (security plan C-37, C-44; docs/guides/deploy.md).
#
# On a version tag (v1.2.3): builds the six production images, scans them,
# pushes them to GitHub Container Registry, signs them with Sigstore keyless
# signing (the signature names this workflow and tag), and publishes a GitHub
# release whose release.env lists every image by digest. The server deploys
# exactly those digests with infra/deploy.sh.
#
# On pull requests that touch the images or the infrastructure, it only
# builds, scans and validates, so a broken Dockerfile is caught before a tag.
name: Release

on:
  push:
    tags: ['v*.*.*']
  pull_request:
    paths:
      - 'infra/**'
      - '.dockerignore'
      - '.github/workflows/release.yml'
      - 'apps/*/next.config.ts'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io/${{ github.repository }}
  PUBLISH: ${{ github.event_name == 'push' }}
  # Trivy runs from its image, pinned by digest, rather than through a
  # third-party action.
  TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

jobs:
  image:
    name: Image (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write # Sigstore keyless signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, dockerfile: infra/docker/api.Dockerfile, app: '' }
          - { name: worker, dockerfile: infra/docker/worker.Dockerfile, app: '' }
          - { name: web, dockerfile: infra/docker/next.Dockerfile, app: web }
          - { name: studio, dockerfile: infra/docker/next.Dockerfile, app: studio }
          - { name: proxy, dockerfile: infra/docker/proxy.Dockerfile, app: '' }
          - { name: postgres, dockerfile: infra/docker/postgres.Dockerfile, app: '' }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            APP=${{ matrix.app || 'web' }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY }}
          load: true
          tags: local/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Scan for known vulnerabilities (HIGH and CRITICAL with a fix)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
            --scanners vuln --no-progress \
            --skip-files /usr/local/bin/gosu \
            local/${{ matrix.name }}:ci

      - name: Check the proxy configuration
        if: matrix.name == 'proxy'
        run: |
          docker run --rm -e DOMAIN=mathpath.example -e ACME_EMAIL=ops@mathpath.example \
            local/proxy:ci caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Log in to the registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            APP=${{ matrix.app || 'web' }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY }}
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ matrix.name }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.name }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUBLISH == 'true'

      - name: Sign and record the digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          NAME: ${{ matrix.name }}
        run: |
          ref="$REGISTRY/$NAME@$DIGEST"
          cosign sign --yes "$ref"
          mkdir -p digests
          echo "IMAGE_$(echo "$NAME" | tr '[:lower:]' '[:upper:]')=$ref" > "digests/$NAME.env"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.PUBLISH == 'true'
        with:
          name: digest-${{ matrix.name }}
          path: digests/${{ matrix.name }}.env
          retention-days: 7

  compose:
    name: Production compose file
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate with placeholder settings
        run: |
          # Every required setting gets a dummy value; compose fails on any
          # setting the file needs that the template does not list.
          sed -E 's/^([A-Z0-9_]+)=$/\1=placeholder/' infra/env.prod.example > /tmp/env.prod
          for name in API WORKER WEB STUDIO PROXY POSTGRES REDIS SEAWEEDFS RCLONE; do
            echo "IMAGE_$name=example.invalid/$name@sha256:$(printf '0%.0s' {1..64})"
          done > /tmp/release.env
          echo APP_VERSION=v0.0.0 >> /tmp/release.env
          touch infra/seaweedfs/s3.prod.json
          docker compose --project-directory infra --env-file /tmp/env.prod --env-file /tmp/release.env \
            -f infra/docker-compose.prod.yml --profile tasks config --quiet
      - name: Shell scripts
        run: shellcheck --external-sources --source-path=SCRIPTDIR --severity=warning infra/*.sh infra/backup/*.sh infra/postgres/initdb/*.sh

  release:
    name: GitHub release
    if: github.event_name == 'push'
    needs: [image, compose]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - name: Write release.env
        run: |
          {
            echo "# Images of MathPath ${GITHUB_REF_NAME}, by digest. Used by infra/deploy.sh."
            echo "APP_VERSION=${GITHUB_REF_NAME}"
            cat digests/*.env
            # Third-party images, pinned here so every release names exact bytes.
            echo "IMAGE_REDIS=redis:7.4.11-alpine@sha256:d9436322172a5b482c187bf1f363d3c4fea086fcca6b9c8a94de8f0f39ed3193"
            echo "IMAGE_SEAWEEDFS=chrislusf/seaweedfs:3.97@sha256:bb05d66d2963b1cc48073190781c3dd29e2c4c88a2ae2986bf58e38c86d89c6e"
            echo "IMAGE_RCLONE=rclone/rclone:1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5"
          } > release.env
          cat release.env
          test "$(grep -c '^IMAGE_' release.env)" -eq 9
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release.env \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
